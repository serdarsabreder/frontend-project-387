name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: server
      - name: Run API tests
        run: npm test
        working-directory: server

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: client
      - name: Typecheck
        run: npm run typecheck
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spec/package-lock.json
      - name: Install TypeSpec
        run: npm ci
        working-directory: spec
      - name: Regenerate OpenAPI contract
        run: npm run generate
        working-directory: spec
      - name: Fail when api-contract.yaml is out of sync
        run: git diff --exit-code -- api-contract.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: [server-tests, client-build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: server
      - name: Install frontend
        run: npm ci
        working-directory: client
      - name: Install e2e
        run: npm ci
        working-directory: e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run E2E tests
        run: npm run test
        working-directory: e2e
