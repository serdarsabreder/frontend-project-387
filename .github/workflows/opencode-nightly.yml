name: Nightly Checks

on:
  schedule:
    - cron: "0 3 * * *"  # 3 AM UTC daily
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: server
      - name: Run API tests
        run: npm test
        working-directory: server

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: client
      - name: Typecheck
        run: npm run typecheck
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client

  lighthouse:
    runs-on: ubuntu-latest
    needs: [client-build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
      - name: Build client
        run: npm ci && npm run build
        working-directory: client
      - name: Run Lighthouse audit
        # No `|| true`: a regression in the recommended preset must fail the
        # nightly run. `staticDistDir` makes LHCI serve the built client itself,
        # so the URL is a path on that static server rather than port 3000.
        run: |
          lhci autorun \
            --collect.url="http://localhost/index.html" \
            --collect.staticDistDir="./client/dist" \
            --assert.preset="lighthouse:recommended" \
            --upload.target="temporary-public-storage"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/*.html
          if-no-files-found: warn
          include-hidden-files: true
