name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Only trusted humans may drive the agent, and bots must never trigger it
    # (prevents self-reply loops). The slash command has to start the comment so
    # a URL or a word like "/october" cannot invoke the workflow.
    if: |
      github.event.comment.user.type != 'Bot' &&
      !contains(github.actor, '[bot]') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, '/oc ') ||
       startsWith(github.event.comment.body, '/opencode ') ||
       github.event.comment.body == '/oc' ||
       github.event.comment.body == '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
